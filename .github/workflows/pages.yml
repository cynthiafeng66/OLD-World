name: Publish kitchen website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Fetch runtime models from Git LFS
        run: git lfs pull --include="$(python3 scripts/build-pages.py --list-lfs)" --exclude=""
      - name: Package the website with real model files
        run: python3 scripts/build-pages.py _site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
